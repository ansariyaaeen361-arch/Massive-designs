<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Demo Plumbing Co. - Contact</title>
<meta name="description" content="Contact our demo plumbing business." />
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; color: #1e293b; }
  nav { display: flex; justify-content: center; gap: 16px; padding: 16px; background: #1e293b; }
  nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
  form { display: grid; gap: 10px; }
  input, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  button[type=submit] { padding: 10px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/contact.html">Contact</a>
  </nav>
  <main>
    <h1>Contact Us</h1>
    <form id="contact-form" onsubmit="event.preventDefault(); document.getElementById('msg').textContent='Message sent — thank you.';">
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />
      <textarea placeholder="Message" rows="4"></textarea>
      <button type="submit">Send Message</button>
    </form>
    <p id="msg"></p>
  </main>
  <script src="http://localhost:4000/track.js" data-site="b0b3871d79e92288d3021e06"></script>
</body>
</html>
